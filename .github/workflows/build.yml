# Compila Kaint en GitHub (Windows, Linux, macOS y la versión web) con los mismos build.bat y
# build.sh de siempre. Solo deja los archivos como «artifacts» de la ejecución (se descargan desde la
# pestaña Actions): no publica nada. Las versiones (Releases) se suben a mano.
#
# - A mano: Actions > «Compilar Kaint» > Run workflow (eligiendo qué sistemas). También lo lanza
#   build.bat (opción 19 del menú, macOS) con la herramienta gh.
# - Solo: con cada push a main y cada pull request que cambie el código (no la documentación).
name: Compilar Kaint

on:
  workflow_dispatch:
    inputs:
      windows:
        description: "Windows x64 (.zip portable e instalador)"
        type: boolean
        default: true
      linux:
        description: "Linux x86_64 (AppImage y .deb)"
        type: boolean
        default: true
      macos:
        description: "macOS arm64 (Kaint.app en .tar.gz)"
        type: boolean
        default: true
      web:
        description: "Versión web (Kaint.HTML, .zip)"
        type: boolean
        default: false
      opend2d:
        description: "OpenD2D para los complementos de Paint.NET (Linux y macOS)"
        type: choice
        options: [latest, main, "off"]
        default: latest
  push:
    branches: [main]
    paths:
      - "src/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "translations/**"
      - "third_party/**"
      - "packaging/**"
      - "data/**"
      - "build.sh"
      - "build.bat"
      - "version.json"
      - "winsetup.json"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "src/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "translations/**"
      - "third_party/**"
      - "packaging/**"
      - "data/**"
      - "build.sh"
      - "build.bat"
      - "version.json"
      - "winsetup.json"
      - ".github/workflows/build.yml"

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la compilación anterior (que ya no sirve).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  OPEND2D: ${{ inputs.opend2d || 'latest' }}

jobs:
  windows:
    name: Windows x64
    if: github.event_name != 'workflow_dispatch' || inputs.windows
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Qt, MinGW, CMake y Ninja (los descarga build.bat, unos 1,5 GB): se guardan entre ejecuciones.
      - name: Caché de las herramientas
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Kaint\toolchain
          key: windows-toolchain-${{ hashFiles('build.bat') }}
          restore-keys: windows-toolchain-

      - name: Compilar (.zip portable e instalador)
        shell: cmd
        run: build.bat --zip --setup --yes

      - name: Subir
        uses: actions/upload-artifact@v4
        with:
          name: Kaint-windows-x64
          path: |
            build-windows/Kaint-*.zip
            build-windows/*-setup.exe
          if-no-files-found: error
          retention-days: 30

  linux-appimage:
    name: Linux AppImage
    if: github.event_name != 'workflow_dispatch' || inputs.linux
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # build.sh compila el AppImage en un contenedor de Ubuntu 22.04 (glibc 2.35: funciona también
      # en distribuciones antiguas) con Qt de aqtinstall; lo descargado queda en build-appimage-cache/.
      - name: Caché de Qt y Rust del contenedor
        uses: actions/cache@v4
        with:
          path: build-appimage-cache
          key: appimage-cache-${{ hashFiles('build.sh') }}
          restore-keys: appimage-cache-

      - name: Compilar el AppImage
        run: ./build.sh --appimage --opend2d "$OPEND2D"

      - name: Subir
        uses: actions/upload-artifact@v4
        with:
          name: Kaint-linux-x86_64-AppImage
          path: |
            build-appimage*/Kaint-*.AppImage
            build-appimage*/Kaint-*.AppImage.zsync
          if-no-files-found: error
          retention-days: 30

  linux-deb:
    name: Linux .deb (Debian 13 / Ubuntu 25.04 o más nuevo)
    if: github.event_name != 'workflow_dispatch' || inputs.linux
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 120
    steps:
      - name: Paquetes para compilar
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl file dpkg-dev \
            build-essential cmake ninja-build qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools \
            qt6-l10n-tools qt6-svg-plugins qt6-wayland zlib1g-dev libgl-dev libssl-dev breeze-icon-theme \
            qt6-image-formats-plugins qt6-translations-l10n qt6-multimedia-dev

      - uses: actions/checkout@v4

      - name: Compilar el .deb
        env:
          KAINT_IN_CONTAINER: "1"
        run: |
          git config --global --add safe.directory "$PWD"
          ./build.sh --deb --opend2d off

      - name: Subir
        uses: actions/upload-artifact@v4
        with:
          name: Kaint-linux-deb
          path: build-deb/kaint_*.deb
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS arm64
    if: github.event_name != 'workflow_dispatch' || inputs.macos
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Qt, Ninja y Bash 5 (Homebrew; build.sh no va con el Bash 3 de macOS)
        run: brew install qt ninja bash

      # build.sh --tar en macOS: Kaint.app con Qt dentro (macdeployqt) en un .tar.gz.
      - name: Compilar
        run: ./build.sh --tar --opend2d "$OPEND2D"

      - name: Subir
        uses: actions/upload-artifact@v4
        with:
          name: Kaint-macos-arm64
          path: build-tar/Kaint-*.tar.gz
          if-no-files-found: error
          retention-days: 30

  web:
    name: Versión web
    if: github.event_name == 'workflow_dispatch' && inputs.web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Crear el .zip
        run: ./build.sh --web

      - name: Subir
        uses: actions/upload-artifact@v4
        with:
          name: Kaint-web
          path: build-web/*.zip
          if-no-files-found: error
          retention-days: 30
