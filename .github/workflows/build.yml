# Compila Kaint en GitHub (Windows, Linux, macOS y la versión web) con los mismos build.bat y
# build.sh de siempre. Solo deja los archivos como «artifacts» de la ejecución (se descargan desde la
# pestaña Actions): no publica nada. Las versiones (Releases) se suben a mano.
#
# Lo que aquí se compila es, sobre todo, lo que no se puede compilar en un PC con Windows x64 o
# Linux x86_64 (Arch, Debian...): Windows arm64, Linux arm64 (AppImage, .deb, tar.gz y musl),
# Alpine, FreeBSD y macOS. Los de arm64 van en los equipos arm64 de GitHub (nativos, sin emular).
#
# - A mano: Actions > «Compilar Kaint» > Run workflow (eligiendo qué sistemas). También lo lanza
#   build.bat (opción 19 del menú, macOS) con la herramienta gh.
# - Solo: con cada push a main y cada pull request que cambie el código (no la documentación).
name: Compilar Kaint

on:
  workflow_dispatch:
    inputs:
      windows:
        description: "Windows x64 (.zip e instalador) y arm64 (.zip)"
        type: boolean
        default: true
      linux:
        description: "Linux (AppImage x86_64 y arm64, .deb x86_64 y arm64, tar.gz arm64, musl x86_64 y arm64)"
        type: boolean
        default: true
      macos:
        description: "macOS arm64 e Intel (Kaint.app en .tar.gz)"
        type: boolean
        default: true
      freebsd:
        description: "FreeBSD x86_64 (.tar.gz)"
        type: boolean
        default: true
      web:
        description: "Versión web (Kaint.HTML, .zip)"
        type: boolean
        default: false
      draft_release:
        description: "Al terminar, crear un borrador de release con los archivos (no se publica solo)"
        type: boolean
        default: false
      opend2d:
        description: "OpenD2D para los complementos de Paint.NET (Linux y macOS)"
        type: choice
        options: [latest, main, "off"]
        default: latest
  push:
    branches: [main]
    paths:
      - "src/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "translations/**"
      - "third_party/**"
      - "packaging/**"
      - "data/**"
      - "build.sh"
      - "build.bat"
      - "version.json"
      - "winsetup.json"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "src/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "translations/**"
      - "third_party/**"
      - "packaging/**"
      - "data/**"
      - "build.sh"
      - "build.bat"
      - "version.json"
      - "winsetup.json"
      - ".github/workflows/build.yml"

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la compilación anterior (que ya no sirve).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  OPEND2D: ${{ inputs.opend2d || 'latest' }}

jobs:
  windows:
    name: Windows x64
    if: github.event_name != 'workflow_dispatch' || inputs.windows
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      # Qt, MinGW, CMake y Ninja (los descarga build.bat, unos 1,5 GB): se guardan entre ejecuciones.
      - name: Caché de las herramientas
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\Kaint\toolchain
          key: windows-toolchain-${{ hashFiles('build.bat') }}
          restore-keys: windows-toolchain-

      - name: Compilar (.zip portable e instalador)
        shell: cmd
        run: build.bat --zip --setup --yes

      - name: Subir
        uses: actions/upload-artifact@v6
        with:
          name: Kaint-windows-x64
          path: |
            build-windows/Kaint-*.zip
            build-windows/*-setup.exe
          if-no-files-found: error
          retention-days: 30

  # En un equipo Windows arm64 de GitHub (windows-11-arm), con el Qt oficial para arm64 y Visual
  # Studio: sin compilación cruzada. (Desde un equipo x64, aqtinstall 3.3.0 no termina de instalar el
  # Qt 6.10 para arm64 «cross_compiled»: falla al buscar bin\qmake.bat, que ese paquete ya no trae.)
  windows-arm64:
    name: Windows arm64
    if: github.event_name != 'workflow_dispatch' || inputs.windows
    runs-on: windows-11-arm
    timeout-minutes: 120
    env:
      QT_ARM64: C:\Qt\6.10.3\msvc2022_arm64
    steps:
      - uses: actions/checkout@v5

      # Qt y el FFmpeg para arm64 que build.bat pone junto a kaint.exe.
      - name: Caché de Qt y FFmpeg (arm64)
        uses: actions/cache@v5
        with:
          path: |
            C:\Qt
            ~\AppData\Local\Kaint\toolchain\ffmpeg-arm64
          key: windows-arm64-native-qt-6.10.3-ffmpeg

      # aqtinstall (el mismo que usa build.bat, de x64: Windows on Arm lo ejecuta emulado).
      - name: Qt para arm64 (aqtinstall)
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:QT_ARM64\lib\cmake\Qt6\Qt6Config.cmake")) {
            curl.exe -L --fail -o aqt.exe https://github.com/miurahr/aqtinstall/releases/download/v3.3.0/aqt_x64.exe
            if ($LASTEXITCODE -ne 0) { exit 1 }
            # Con Qt Multimedia (la intro y el audio del editor de GIF); si no lo hubiera para arm64,
            # sin él (Kaint compila igual).
            .\aqt.exe install-qt windows_arm64 desktop 6.10.3 win64_msvc2022_arm64 -m qtimageformats qtmultimedia --outputdir C:\Qt
            if (-not (Test-Path "$env:QT_ARM64\lib\cmake\Qt6\Qt6Config.cmake")) {
              .\aqt.exe install-qt windows_arm64 desktop 6.10.3 win64_msvc2022_arm64 -m qtimageformats --outputdir C:\Qt
            }
            # Lo que importa para compilar con CMake es lib\cmake: si aqtinstall falla después, al
            # retocar qmake (que no se usa), se sigue.
            if (-not (Test-Path "$env:QT_ARM64\lib\cmake\Qt6\Qt6Config.cmake")) {
              Write-Error "No se instaló Qt para arm64 en $env:QT_ARM64"
              exit 1
            }
          }
          exit 0

      - name: Compilar (.zip portable)
        shell: cmd
        env:
          KAINT_QT_ARM64: ${{ env.QT_ARM64 }}
        run: build.bat --zip --arm64 --yes

      - name: Subir
        uses: actions/upload-artifact@v6
        with:
          name: Kaint-windows-arm64
          path: build-windows*/Kaint-*arm64*.zip
          if-no-files-found: error
          retention-days: 30

  linux-appimage:
    name: Linux AppImage ${{ matrix.arch }}
    if: github.event_name != 'workflow_dispatch' || inputs.linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04, cache: build-appimage-cache }
          - { arch: aarch64, runner: ubuntu-24.04-arm, cache: build-appimage-cache-aarch64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      # build.sh compila el AppImage en un contenedor de Ubuntu 22.04 (glibc 2.35: funciona también
      # en distribuciones antiguas) con Qt de aqtinstall (el de x86_64 o el de arm64); lo descargado
      # queda en build-appimage-cache/ (o build-appimage-cache-aarch64/).
      - name: Caché de Qt y Rust del contenedor
        uses: actions/cache@v5
        with:
          path: ${{ matrix.cache }}
          key: appimage-cache-${{ matrix.arch }}-${{ hashFiles('build.sh') }}
          restore-keys: appimage-cache-${{ matrix.arch }}-

      - name: Compilar el AppImage
        run: ./build.sh --appimage --opend2d "$OPEND2D"

      - name: Subir
        uses: actions/upload-artifact@v6
        with:
          name: Kaint-linux-${{ matrix.arch }}-AppImage
          path: |
            build-appimage*/Kaint-*.AppImage
            build-appimage*/Kaint-*.AppImage.zsync
          if-no-files-found: error
          retention-days: 30

  linux-deb:
    name: Linux .deb ${{ matrix.arch }} (Debian 13 / Ubuntu 25.04 o más nuevo)
    if: github.event_name != 'workflow_dispatch' || inputs.linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    timeout-minutes: 120
    steps:
      - name: Paquetes para compilar
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl file dpkg-dev \
            build-essential cmake ninja-build qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools \
            qt6-l10n-tools qt6-svg-plugins qt6-wayland zlib1g-dev libgl-dev libssl-dev breeze-icon-theme \
            qt6-image-formats-plugins qt6-translations-l10n qt6-multimedia-dev

      - uses: actions/checkout@v5

      - name: Compilar el .deb
        env:
          KAINT_IN_CONTAINER: "1"
        run: |
          git config --global --add safe.directory "$PWD"
          ./build.sh --deb --opend2d off

      - name: Subir
        uses: actions/upload-artifact@v6
        with:
          name: Kaint-linux-deb-${{ matrix.arch }}
          path: build-deb/kaint_*.deb
          if-no-files-found: error
          retention-days: 30

  # El .tar.gz de Linux arm64 (glibc): necesita Qt 6.5 o posterior en el sistema, como el .deb.
  linux-tar-arm64:
    name: Linux tar.gz arm64 (Debian 13 / Ubuntu 25.04 o más nuevo)
    if: github.event_name != 'workflow_dispatch' || inputs.linux
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    timeout-minutes: 120
    steps:
      - name: Paquetes para compilar
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl file \
            build-essential cmake ninja-build qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools \
            qt6-l10n-tools qt6-svg-plugins qt6-wayland zlib1g-dev libgl-dev libssl-dev breeze-icon-theme \
            qt6-image-formats-plugins qt6-translations-l10n qt6-multimedia-dev

      - uses: actions/checkout@v5

      - name: Compilar el .tar.gz
        env:
          KAINT_IN_CONTAINER: "1"
        run: |
          git config --global --add safe.directory "$PWD"
          ./build.sh --tar --opend2d off

      - name: Subir
        uses: actions/upload-artifact@v6
        with:
          name: Kaint-linux-aarch64-tar
          path: build-tar*/Kaint-*.tar.gz
          if-no-files-found: error
          retention-days: 30

  linux-alpine:
    name: Linux musl ${{ matrix.arch }} (Alpine)
    if: github.event_name != 'workflow_dispatch' || inputs.linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04, flags: "" }
          - { arch: aarch64, runner: ubuntu-24.04-arm, flags: "--arm64" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      # build.sh --musl compila dentro de un contenedor de Alpine (podman o docker), de la
      # arquitectura del equipo (--arm64: el de arm64).
      - name: Compilar el .tar.gz
        run: ./build.sh --tar --musl ${{ matrix.flags }}

      - name: Subir
        uses: actions/upload-artifact@v6
        with:
          name: Kaint-linux-musl-${{ matrix.arch }}
          path: build-tar*/Kaint-*.tar.gz
          if-no-files-found: error
          retention-days: 30

  freebsd:
    name: FreeBSD x86_64
    if: github.event_name != 'workflow_dispatch' || inputs.freebsd
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      # Una máquina virtual de FreeBSD: build.sh --tar ahí (lo creado vuelve a esta carpeta).
      - name: Compilar en FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y bash git cmake ninja qt6-base qt6-tools qt6-svg
          run: bash ./build.sh --tar --opend2d off

      - name: Subir
        uses: actions/upload-artifact@v6
        with:
          name: Kaint-freebsd-x86_64
          path: build-tar/Kaint-*.tar.gz
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS ${{ matrix.arch }}
    if: github.event_name != 'workflow_dispatch' || inputs.macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-15 }
          - { arch: x86_64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Qt, Ninja y Bash 5 (Homebrew; build.sh no va con el Bash 3 de macOS)
        run: brew install qt ninja bash

      # build.sh --tar en macOS: Kaint.app con Qt dentro (macdeployqt) en un .tar.gz.
      - name: Compilar
        run: ./build.sh --tar --opend2d "$OPEND2D"

      - name: Subir
        uses: actions/upload-artifact@v6
        with:
          name: Kaint-macos-${{ matrix.arch }}
          path: build-tar/Kaint-*.tar.gz
          if-no-files-found: error
          retention-days: 30

  web:
    name: Versión web
    if: github.event_name == 'workflow_dispatch' && inputs.web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Crear el .zip
        run: ./build.sh --web

      - name: Subir
        uses: actions/upload-artifact@v6
        with:
          name: Kaint-web
          path: build-web/*.zip
          if-no-files-found: error
          retention-days: 30

  # Opcional (solo a mano, con «draft_release»): todos los archivos en un BORRADOR de release
  # (v<versión de version.json>), sin el .zip de GitHub alrededor de cada uno. No se publica: se
  # revisa y se pulsa «Publish release» en GitHub. Si el borrador ya existe, se reemplazan los archivos.
  release:
    name: Borrador de release
    needs: [windows, windows-arm64, linux-appimage, linux-deb, linux-tar-arm64, linux-alpine, freebsd, macos, web]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.draft_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Descargar lo compilado
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Crear o actualizar el borrador
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' version.json)
          files=$(find dist -type f | sort)
          if [ -z "$files" ]; then
            echo "No se compiló nada: no hay borrador." >&2
            exit 1
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            # Una release ya publicada no se toca.
            if [ "$(gh release view "v$version" --json isDraft -q .isDraft)" != "true" ]; then
              echo "La release v$version ya está publicada: no se cambia." >&2
              exit 1
            fi
            gh release upload "v$version" $files --clobber
          else
            gh release create "v$version" $files --draft --target "$GITHUB_SHA" --title "Kaint $version" --generate-notes
          fi
          echo "Borrador listo: Releases > Kaint $version > Edit > Publish release."
